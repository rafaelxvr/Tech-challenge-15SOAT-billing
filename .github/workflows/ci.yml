name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, feat/billing-service]

# Controle S-7: permissão mínima por padrão; nenhum job precisa de credencial de nuvem nem de escrita.
permissions:
  contents: read

concurrency:
  group: billing-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Identificador do conjunto de contratos v1 (sha256 de contracts/CONTRACTS.sha256); igual nos tres repositorios.
  CONTRACT_SET_SHA256: 35d863ecc103d4b4ff271004ac21626cbead715de008479381810cb57440e5b0
  # Imagens de ferramentas fixadas por digest imutável.
  TRIVY_IMAGE: aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 # 0.58.1
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 # v8.21.2

jobs:
  build-and-test:
    name: Build, testes, JaCoCo e SAST (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar checksum da distribuição do Maven Wrapper
        run: |
          set +x
          grep -Eq '^distributionSha256Sum=[0-9a-f]{64}$' .mvn/wrapper/maven-wrapper.properties

      # verify = testes + JaCoCo (cobertura de linhas >= 80%) + SpotBugs/Find Security Bugs (SAST).
      - name: Verify
        run: bash ./mvnw -B verify

      - name: Resumo de cobertura e SAST (SHA ${{ github.sha }})
        run: |
          set +x
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          raiz = E.parse('target/site/jacoco/jacoco.xml').getroot()
          for c in raiz.findall('counter'):
              if c.get('type') == 'LINE':
                  m, v = int(c.get('missed')), int(c.get('covered'))
                  print(f'JaCoCo LINE {v / (m + v):.4f} ({v}/{m + v})')
          PY
          test -f target/spotbugsXml.xml && grep -o 'total_bugs="[0-9]*"' target/spotbugsXml.xml | head -1

      - name: Scanner de artefatos (falha antes do upload se houver token ou PII)
        run: bash scripts/scan-artifacts.sh target/site/jacoco target/surefire-reports

      - name: Relatórios (JaCoCo e surefire)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: relatorios-${{ github.sha }}
          path: |
            target/site/jacoco
            target/surefire-reports
          retention-days: 14

  supply-chain:
    name: SCA (Trivy), segredos (Gitleaks) e contrato de entrega
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo para o Gitleaks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (versão fixada)
        run: |
          set +x
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" detect --source /repo --no-banner --redact --verbose

      - name: SCA das dependências (Trivy fs; falha em HIGH/CRITICAL com correção)
        run: |
          set +x
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile /src/.trivyignore --exit-code 1 /src/pom.xml

  kind-deploy:
    name: Deploy em Kind efêmero (SHA exato)
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}
      OVERLAY: kind-fake
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar o Kind (somente o binário)
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          install_only: true

      - name: Subir o cluster Kind, as dependências locais e o billing
        run: |
          set +x
          bash scripts/deploy-kind.sh up

      - name: Scan da imagem (Trivy image; falha em HIGH/CRITICAL com correção)
        run: |
          set +x
          scan_dir="$(mktemp -d)"
          docker save "billing-service:${COMMIT_SHA}" -o "${scan_dir}/imagem.tar"
          docker run --rm -v "${scan_dir}:/work:ro" -v "$PWD:/src:ro" "$TRIVY_IMAGE" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore --exit-code 1 --input /work/imagem.tar
          rm -rf "$scan_dir"

      - name: Saúde do pod e fumaça de mensageria
        run: |
          set +x
          bash scripts/deploy-kind.sh verify

      - name: Scanner de artefatos (falha antes do upload se houver token ou PII)
        run: bash scripts/scan-artifacts.sh target/kind-evidence

      - name: Evidência do Kind
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: kind-evidencia-${{ github.sha }}
          path: target/kind-evidence
          retention-days: 14

      - name: Remover o cluster Kind descartável
        if: always()
        run: bash scripts/deploy-kind.sh down

  # Quality gate do SonarCloud (UNR-618). Ativo com a variável de repositório SONAR_ENABLED=true
  # ou por execução manual (workflow_dispatch). Quando ativo, não há skip silencioso: sem
  # SONAR_TOKEN o job FALHA com mensagem explícita.
  # Organização e chave do projeto ficam no pom.xml (não secretas); só o token é secret.
  # PR vindo de fork não recebe secrets e fica fora do gate.
  sonar:
    name: SonarCloud e quality gate
    if: ${{ (vars.SONAR_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SONAR_MAVEN_PLUGIN: org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121
    steps:
      - name: Checkout (SHA ${{ github.sha }})
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Exigir configuração do SonarCloud (falha, nunca ignora)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +x
          faltando=0
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Secret SONAR_TOKEN ausente. Cadastre-o em Settings > Secrets and variables > Actions ou desative o gate com SONAR_ENABLED=false."
            faltando=1
          fi
          exit "$faltando"

      # verify gera o JaCoCo XML (target/site/jacoco/jacoco.xml) lido pelo scanner.
      # qualitygate.wait faz o job falhar se o quality gate reprovar. O token só vai por env, nunca para o log.
      - name: Análise e espera do quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +x
          bash ./mvnw -B -q verify "${SONAR_MAVEN_PLUGIN}:sonar"             -Dsonar.host.url=https://sonarcloud.io               -Dsonar.qualitygate.wait=true             -Dsonar.qualitygate.timeout=600

      - name: Evidência do quality gate (SHA ${{ github.sha }})
        if: always()
        run: |
          set +x
          {
            echo "### SonarCloud"
            echo "- Commit analisado: \`${GITHUB_SHA}\`"
            echo "- Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -f target/sonar/report-task.txt ]; then
              echo "- Painel: $(grep '^dashboardUrl=' target/sonar/report-task.txt | cut -d= -f2-)"
            else
              echo "- Painel: indisponível (a análise não chegou a publicar)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
