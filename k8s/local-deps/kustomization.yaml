apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - postgres-billing.yaml
  - localstack.yaml
configMapGenerator:
  - name: postgres-billing-init
    namespace: data
    files:
      - 01-roles.sh=postgres-init/01-roles.sh
    options:
      disableNameSuffixHash: true
