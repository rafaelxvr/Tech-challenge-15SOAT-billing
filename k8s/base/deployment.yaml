apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: oficina-billing}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oficina-billing}
    spec:
      serviceAccountName: oficina-billing
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: billing
          image: billing-service
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: kind}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: oficina-billing-secrets, key: db_app_password}}
            - name: DB_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: oficina-billing-secrets, key: db_migrator_password}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: oficina-billing-secrets, key: jwt_secret}}
          envFrom:
            - configMapRef: {name: oficina-billing-config}
          startupProbe:
            httpGet: {path: /billing/actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /billing/actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /billing/actuator/health/liveness, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
