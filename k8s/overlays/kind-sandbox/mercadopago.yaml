apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing
spec:
  template:
    spec:
      containers:
        - name: billing
          env:
            - {name: MP_SANDBOX, value: "true"}
            - name: MP_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: oficina-billing-secrets, key: mp_access_token}}
            - name: MP_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: oficina-billing-secrets, key: mp_webhook_secret, optional: true}}
