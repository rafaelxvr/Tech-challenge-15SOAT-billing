# EXEMPLO: contrato de chaves do Secret `oficina-billing-secrets` no perfil aws.
# NÃO faz parte do render do Kustomize (fora de `resources`). O Secret real é criado fora de banda
# (kubectl create secret / pipeline); nunca versione valores reais aqui.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-secrets
type: Opaque
stringData:
  db_app_password: "<PLACEHOLDER-senha-do-billing_app>"
  db_migrator_username: "<PLACEHOLDER-usuario-migrador-billing_migrator>"
  db_migrator_password: "<PLACEHOLDER-senha-do-billing_migrator>"
  jwt_secret: "<PLACEHOLDER-jwt-secret>"
