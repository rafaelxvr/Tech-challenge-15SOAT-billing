apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing
spec:
  template:
    spec:
      containers:
        - name: billing
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: "kind,gateway-fake"}
            - name: MP_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: oficina-billing-secrets, key: mp_webhook_secret}}
