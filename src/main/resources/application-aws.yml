# Perfil AWS (AWS Academy / Learner Lab): o cliente SQS usa a default credentials provider chain do AWS SDK.
# Sem endpoint local e sem credencial estática: nenhuma credencial mora neste arquivo.
# Região e URLs das filas chegam por variáveis de ambiente injetadas pelo deploy.
billing:
  mensageria:
    enabled: ${BILLING_MENSAGERIA_ENABLED:true}
    region: ${AWS_REGION:us-east-1}
    endpoint:
    fila-comandos: ${BILLING_FILA_COMANDOS:}
    fila-respostas: ${BILLING_FILA_RESPOSTAS:}
